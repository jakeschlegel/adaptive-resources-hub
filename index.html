<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | Adaptive Security</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#262626',
                        secondary: '#3b3b3b',
                        tertiary: 'rgba(38,38,38,0.6)',
                        border: {
                            light: 'rgba(38,38,38,0.08)',
                            medium: 'rgba(38,38,38,0.12)',
                            divider: '#d8d8d8',
                            strong: '#262626'
                        },
                        accent: {
                            DEFAULT: '#EA580C',
                            light: '#F97316',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        heading: ['FK Grotesk', 'Inter', 'system-ui', 'sans-serif'],
                    },
                    spacing: {
                        'section': '100px',
                        'section-y': '104px',
                    },
                    borderRadius: {
                        'xs': '4px',
                        'sm': '6px',
                        'md': '8px',
                        'lg': '12px',
                    }
                }
            }
        }
    </script>
    <style>
        @font-face {
            font-family: 'FK Grotesk';
            src: local('FK Grotesk'), local('FKGrotesk-Regular');
            font-weight: 400;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: #262626;
            min-height: 100vh;
        }

        .font-heading {
            font-family: 'FK Grotesk', 'Inter', system-ui, sans-serif;
            letter-spacing: -0.02em;
        }

        .resource-card {
            transition: all 0.3s ease;
        }
        .resource-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 27px -11px rgba(0,0,0,0.02),
                        0 18px 18px -11px rgba(0,0,0,0.03),
                        0 9px 13px -7px rgba(0,0,0,0.03);
        }

        .filter-btn {
            transition: all 0.2s ease;
        }
        .filter-btn:hover:not(.active) {
            background: #f5f5f5;
        }
        .filter-btn.active {
            border-color: #262626;
            background: #262626;
            color: white;
        }

        .resource-gradient {
            background: linear-gradient(90deg, #feefd4 0%, #ffd886 49.52%, #ffc59d 100%);
        }

        .link-btn:hover {
            opacity: 0.7;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
        }

        /* Type badge colors */
        .badge-guide { background: #E0F2FE; color: #0369A1; }
        .badge-video { background: #FEE2E2; color: #DC2626; }
        .badge-blog { background: #F3E8FF; color: #7C3AED; }
        .badge-event { background: #DCFCE7; color: #16A34A; }
        .badge-update { background: #FEF3C7; color: #D97706; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

            {

            {

                excerpt: "A comprehensive guide to meeting GDPR security awareness training obligations.",
                date: "Dec 5, 2024",
                image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600&h=400&fit=crop"
            },
            {
                id: 12,
                type: "Blog",
                topic: "Security Awareness",
                title: "Measuring Training Effectiveness",
                excerpt: "Key metrics and strategies for measuring the impact of your security awareness program.",

        ];

        // Top Banner
        function TopBanner() {
            return (
                <div className="bg-accent text-white py-2 px-6 text-center text-sm">
                    <span className="inline-flex items-center gap-2">
                        <span className="bg-white/20 px-2 py-0.5 rounded text-xs font-medium">New Funding</span>
                        <span>We raised a $43M Series A from A16Z and OpenAI</span>
                        <a href="#" className="underline hover:no-underline ml-1">read more</a>
                    </span>
                </div>
            );
        }

        // Navigation
        function Nav() {
            return (
                <nav className="sticky top-0 z-50 bg-white border-b border-border-light">
                    <div className="max-w-[1440px] mx-auto px-[100px] py-4 flex items-center justify-between">
                        <a href="/" className="flex items-center gap-2">
                            <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect width="32" height="32" rx="6" fill="#262626"/>
                                <path d="M10 18.5V13.5C10 12.1193 11.1193 11 12.5 11H19.5C20.8807 11 22 12.1193 22 13.5V18.5C22 19.8807 20.8807 21 19.5 21H12.5C11.1193 21 10 19.8807 10 18.5Z" stroke="white" strokeWidth="2"/>
                                <rect x="14" y="14" width="4" height="4" rx="1" fill="white"/>
                            </svg>
                            <span className="font-medium text-primary">Adaptive</span>
                        </a>
                        <div className="hidden md:flex items-center gap-8">
                            <a href="#" className="text-primary text-sm hover:opacity-70 transition flex items-center gap-1">
                                Products
                                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                            </a>
                            <a href="#" className="text-primary text-sm hover:opacity-70 transition flex items-center gap-1">
                                Solutions
                                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                            </a>
                            <a href="#" className="text-primary text-sm hover:opacity-70 transition">Customers</a>
                            <a href="#" className="text-primary text-sm font-medium border-b-2 border-primary pb-0.5">
                                Resources
                            </a>
                            <a href="#" className="text-primary text-sm hover:opacity-70 transition">Pricing</a>
                        </div>
                        <a href="#" className="bg-primary hover:bg-primary/90 transition text-white px-4 py-2 rounded-sm text-sm font-medium">
                            Get demo
                        </a>
                    </div>
                </nav>
            );
        }

        // Hero with Featured Resource
        function Hero({ featuredResource }) {
            const getBadgeClass = (type) => {
                const classes = {
                    'Guide': 'badge-guide',
                    'Video': 'badge-video',
                    'Blog': 'badge-blog',
                    'Event': 'badge-event',
                    'Product Update': 'badge-update'
                };
                return classes[type] || 'badge-guide';
            };

            return (
                <section className="bg-gradient-to-b from-transparent to-[#f5f5f5] px-[100px] py-[104px]">
                    <div className="max-w-[1240px] mx-auto">
                        {/* Header */}
                        <div className="mb-16">
                            <h1 className="font-heading text-[56px] leading-[1.2] tracking-[-1.12px] text-primary mb-6">
                                Resources
                            </h1>
                            <p className="text-lg leading-[1.5] text-secondary max-w-[600px]">
                                Guides, videos, blogs, and product updates to help you build a security-aware workforce.
                            </p>
                        </div>

                        {/* Featured Resource */}
                        <a href="#" className="block bg-white rounded-lg border border-border-light overflow-hidden hover:shadow-lg transition group">
                            <div className="flex">
                                {/* Image */}
                                <div className="resource-gradient w-[55%] h-[400px] flex-shrink-0 relative overflow-hidden">
                                    <img
                                        src={featuredResource.image}
                                        alt={featuredResource.title}
                                        className="w-full h-full object-cover mix-blend-multiply opacity-80 group-hover:scale-105 transition duration-500"
                                    />
                                </div>

                                {/* Content */}
                                <div className="flex-1 p-10 flex flex-col justify-center">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className="inline-flex items-center justify-center h-6 px-2 border border-border-divider rounded-xs text-xs font-medium text-primary">
                                            Featured
                                        </span>
                                        <span className={`inline-flex items-center h-6 px-2 rounded-xs text-xs font-medium ${getBadgeClass(featuredResource.type)}`}>
                                            {featuredResource.type}
                                        </span>
                                    </div>
                                    <h2 className="font-heading text-[36px] leading-[1.2] tracking-[-0.72px] text-primary mb-4">
                                        {featuredResource.title}
                                    </h2>
                                    <p className="text-base leading-[1.6] text-secondary mb-6">
                                        {featuredResource.excerpt}
                                    </p>
                                    <div className="flex items-center gap-4 text-sm text-tertiary">
                                        <span>{featuredResource.date}</span>
                                        <span>•</span>
                                        <span>{featuredResource.topic}</span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                </section>
            );
        }

        // Filter Bar
        function FilterBar({ activeType, setActiveType, activeTopic, setActiveTopic, searchQuery, setSearchQuery, resourceCount }) {
            return (
                <div className="bg-white border-b border-border-light sticky top-[65px] z-40">
                    <div className="max-w-[1240px] mx-auto px-[100px] py-4">
                        <div className="flex items-center justify-between gap-6">
                            {/* Left: Filters */}
                            <div className="flex items-center gap-6">
                                {/* Type Filter */}
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-medium text-tertiary uppercase tracking-wide">Type:</span>
                                    <div className="flex items-center gap-1.5">
                                        {TYPES.map(type => (
                                            <button
                                                key={type}
                                                onClick={() => setActiveType(type)}
                                                className={`filter-btn h-8 px-3 rounded-sm text-sm font-medium border transition whitespace-nowrap ${
                                                    activeType === type
                                                        ? 'active'
                                                        : 'border-border-divider bg-white text-primary'
                                                }`}
                                            >
                                                {type === "All Types" ? "All" : type}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Divider */}
                                <div className="w-px h-6 bg-border-divider"></div>

                                {/* Topic Filter */}
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-medium text-tertiary uppercase tracking-wide">Topic:</span>
                                    <select
                                        value={activeTopic}
                                        onChange={(e) => setActiveTopic(e.target.value)}
                                        className="h-8 px-3 pr-8 rounded-sm text-sm font-medium border border-border-divider bg-white text-primary focus:outline-none focus:border-primary cursor-pointer appearance-none"
                                        style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3 4.5L6 7.5L9 4.5' stroke='%23262626' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E")`, backgroundRepeat: 'no-repeat', backgroundPosition: 'right 8px center' }}
                                    >
                                        {TOPICS.map(topic => (
                                            <option key={topic} value={topic}>{topic}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Right: Search + Count */}
                            <div className="flex items-center gap-4">
                                <span className="text-sm text-tertiary">{resourceCount} resources</span>
                                <div className="relative w-[240px]">
                                    <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-tertiary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                    </svg>
                                    <input
                                        type="text"
                                        placeholder="Search resources..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-white border border-border-divider rounded-sm pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-primary transition placeholder:text-tertiary"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Resource Card
        function ResourceCard({ resource, index }) {
            const getBadgeClass = (type) => {
                const classes = {
                    'Guide': 'badge-guide',
                    'Video': 'badge-video',
                    'Blog': 'badge-blog',
                    'Event': 'badge-event',
                    'Product Update': 'badge-update'
                };
                return classes[type] || 'badge-guide';
            };

            const getIcon = (type) => {
                const icons = {
                    'Guide': (
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    ),
                    'Video': (
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    ),
                    'Blog': (
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                        </svg>
                    ),
                    'Event': (
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    ),
                    'Product Update': (
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    )
                };
                return icons[type] || icons['Guide'];
            };

            const getMeta = (resource) => {
                if (resource.duration) return resource.duration;
                if (resource.readTime) return resource.readTime;
                if (resource.eventType) return resource.eventType;
                return null;
            };

            return (
                <a
                    href="#"
                    className="resource-card block bg-white rounded-lg border border-border-light overflow-hidden animate-in"
                    style={{ animationDelay: `${index * 0.05}s` }}
                >
                    {/* Image */}
                    <div className="relative h-[180px] overflow-hidden bg-gray-100">
                        <img
                            src={resource.image}
                            alt={resource.title}
                            className="w-full h-full object-cover"
                        />
                        {resource.type === 'Video' && (
                            <div className="absolute inset-0 flex items-center justify-center bg-black/20">
                                <div className="w-12 h-12 rounded-full bg-white/90 flex items-center justify-center">
                                    <svg className="w-5 h-5 text-primary ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Content */}
                    <div className="p-5">
                        <div className="flex items-center gap-2 mb-3">
                            <span className={`inline-flex items-center gap-1.5 h-6 px-2 rounded-xs text-xs font-medium ${getBadgeClass(resource.type)}`}>
                                {getIcon(resource.type)}
                                {resource.type}
                            </span>
                        </div>
                        <h3 className="font-heading text-lg leading-[1.3] tracking-[-0.36px] text-primary mb-2 line-clamp-2">
                            {resource.title}
                        </h3>
                        <p className="text-sm text-secondary leading-[1.5] mb-4 line-clamp-2">
                            {resource.excerpt}
                        </p>
                        <div className="flex items-center gap-3 text-xs text-tertiary">
                            <span>{resource.date}</span>
                            {getMeta(resource) && (
                                <>
                                    <span>•</span>
                                    <span>{getMeta(resource)}</span>
                                </>
                            )}
                        </div>
                    </div>
                </a>
            );
        }

        // Resources Grid
        function ResourcesGrid({ resources }) {
            if (resources.length === 0) {
                return (
                    <div className="text-center py-20">
                        <div className="w-16 h-16 mx-auto mb-4 rounded-full bg-gray-100 flex items-center justify-center">
                            <svg className="w-8 h-8 text-tertiary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <h3 className="font-heading text-xl text-primary mb-2">No resources found</h3>
                        <p className="text-secondary">Try adjusting your filters or search query.</p>
                    </div>
                );
            }

            return (
                <div className="grid grid-cols-3 gap-6">
                    {resources.map((resource, index) => (
                        <ResourceCard key={resource.id} resource={resource} index={index} />
                    ))}
                </div>
            );
        }

        // Newsletter
        function Newsletter() {
            return (
                <section className="px-[100px] py-14 bg-[#f5f5f5]">
                    <div className="max-w-[1240px] mx-auto">
                        <div className="bg-white border border-border-light rounded-lg overflow-hidden">
                            <div className="flex items-center justify-between px-12 py-8">
                                <div>
                                    <h3 className="font-heading text-xl text-primary mb-1">Stay up to date</h3>

        // Main App
        function App() {
            const [activeType, setActiveType] = useState("All Types");
            const [activeTopic, setActiveTopic] = useState("All Topics");
            const [searchQuery, setSearchQuery] = useState("");

            const featuredResource = RESOURCES.find(r => r.featured);

            const filteredResources = useMemo(() => {
                return RESOURCES.filter(resource => {
                    // Don't show featured in the grid
                    if (resource.featured) return false;

                    // Type filter
                    if (activeType !== "All Types" && resource.type !== activeType) {
                        return false;
                    }

                    // Topic filter
                    if (activeTopic !== "All Topics" && resource.topic !== activeTopic) {
                        return false;
                    }

                    // Search filter
                    if (searchQuery) {
                        const query = searchQuery.toLowerCase();
                        return (
                            resource.title.toLowerCase().includes(query) ||
                            resource.excerpt.toLowerCase().includes(query) ||
                            resource.type.toLowerCase().includes(query) ||
                            resource.topic.toLowerCase().includes(query)
                        );
                    }

                    return true;
                });
            }, [activeType, activeTopic, searchQuery]);

            return (
                <div className="min-h-screen bg-white">
                    <TopBanner />
                    <Nav />
                    <Hero featuredResource={featuredResource} />
                    <FilterBar
                        activeType={activeType}
                        setActiveType={setActiveType}
                        activeTopic={activeTopic}
                        setActiveTopic={setActiveTopic}
                        searchQuery={searchQuery}
                        setSearchQuery={setSearchQuery}
                        resourceCount={filteredResources.length}
                    />
                    <section className="px-[100px] py-12 bg-[#f5f5f5] min-h-[600px]">
                        <div className="max-w-[1240px] mx-auto">
                            <ResourcesGrid resources={filteredResources} />
                        </div>
                    </section>
                    <Newsletter />
                    <Footer />
                </div>
            );
        }
