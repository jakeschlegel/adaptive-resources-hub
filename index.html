        // Main App
        function App() {
            const [activeType, setActiveType] = useState("All Types");
            const [activeTopic, setActiveTopic] = useState("All Topics");
            const [searchQuery, setSearchQuery] = useState("");

            const featuredResource = RESOURCES.find(r => r.featured);

            const filteredResources = useMemo(() => {
                return RESOURCES.filter(resource => {
                    // Don't show featured in the grid
                    if (resource.featured) return false;

                    // Type filter
                    if (activeType !== "All Types" && resource.type !== activeType) {
                        return false;
                    }

                    // Topic filter
                    if (activeTopic !== "All Topics" && resource.topic !== activeTopic) {
                        return false;
                    }

                    // Search filter
                    if (searchQuery) {
                        const query = searchQuery.toLowerCase();
                        return (
                            resource.title.toLowerCase().includes(query) ||
                            resource.excerpt.toLowerCase().includes(query) ||
                            resource.type.toLowerCase().includes(query) ||
                            resource.topic.toLowerCase().includes(query)
                        );
                    }

                    return true;
                });
            }, [activeType, activeTopic, searchQuery]);

            return (
                <div className="min-h-screen bg-white">
                    <TopBanner />
                    <Nav />
                    <Hero featuredResource={featuredResource} />
                    <FilterBar
                        activeType={activeType}
                        setActiveType={setActiveType}
                        activeTopic={activeTopic}
                        setActiveTopic={setActiveTopic}
                        searchQuery={searchQuery}
                        setSearchQuery={setSearchQuery}
                        resourceCount={filteredResources.length}
                    />
                    <section className="px-[100px] py-12 bg-[#f5f5f5] min-h-[600px]">
                        <div className="max-w-[1240px] mx-auto">
                            <ResourcesGrid resources={filteredResources} />
                        </div>
                    </section>
                    <Newsletter />
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
