        /* Card hover effects */

            transform: translateY(-4px);

        }

        /* Filter button styles */

        .filter-btn.active {

            from {

                transform: translateY(20px);

            to {

                transform: translateY(0);

        // Main App
        function App() {
            const [activeTopic, setActiveTopic] = useState("All");
            const [activeType, setActiveType] = useState("All");
            const [searchQuery, setSearchQuery] = useState("");

            const filteredResources = useMemo(() => {
                return RESOURCES.filter(resource => {
                    // Topic filter
                    if (activeTopic !== "All" && !resource.topics.includes(activeTopic)) {
                        return false;
                    }

                    // Type filter
                    if (activeType !== "All") {
                        const typeMap = {
                            "Guides": "Guide",
                            "Product Updates": "Product Update",
                            "Videos": "Video",
                            "Blogs": "Blog",
                            "Events": "Event"
                        };
                        if (resource.type !== typeMap[activeType]) {
                            return false;
                        }
                    }

                    // Search filter
                    if (searchQuery) {
                        const query = searchQuery.toLowerCase();
                        return (
                            resource.title.toLowerCase().includes(query) ||
                            resource.excerpt.toLowerCase().includes(query) ||
                            resource.topics.some(t => t.toLowerCase().includes(query))
                        );
                    }

                    return true;
                });
            }, [activeTopic, activeType, searchQuery]);

            // Non-featured resources for grid
            const gridResources = filteredResources.filter(r => !r.featured || activeTopic !== "All" || activeType !== "All" || searchQuery);

            return (
                <div className="min-h-screen">
                    <Nav />
                    <Hero />
                    {activeTopic === "All" && activeType === "All" && !searchQuery && (
                        <FeaturedResources resources={RESOURCES} />
                    )}
                    <FilterBar
                        activeTopic={activeTopic}
                        setActiveTopic={setActiveTopic}
                        activeType={activeType}
                        setActiveType={setActiveType}
                        searchQuery={searchQuery}
                        setSearchQuery={setSearchQuery}
                    />
                    <ResourceGrid resources={gridResources} />
                    <NewsletterCTA />
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
